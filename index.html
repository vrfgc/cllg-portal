<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>College Faculty Record Management</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="background-animation"></div>

<!-- START PAGE -->
<div class="container" id="startPage">
    <h1 class="title">VIDYARASHMI FIRST GRADE COLLEGE SAVANOOR,PUTTUR<br>LECTURES FACULTY RECORD MANAGEMENT SYSTEM</h1>

    <button class="btn pulse" onclick="showLogin()">
        START
    </button>
</div>

<!-- LOGIN PAGE -->
<div class="container hidden" id="loginPage">

    <div class="login-box">
        <h2>User Login</h2>

        <input type="text" id="username" placeholder="Enter Username">

        <input type="password" id="password" placeholder="Enter Password">

        <button class="btn" onclick="login()">
            Login
        </button>

        <p id="message"></p>
    </div>

</div>

<!-- DASHBOARD -->
<div class="container hidden" id="dashboard">

    <h2>Dashboard / Main Menu</h2>

    <div class="menu">

        <button class="card" onclick="openRegister()">
            Faculty Registration
        </button>

        <button class="card" onclick="openProfile()">
            Faculty Profile
        </button>

        <button class="card" onclick="openSearch()">
            Search Records
        </button>

        <button class="card logout" onclick="logout()">
            Logout
        </button>

    </div>

</div>

<!-- FACULTY REGISTRATION -->
<div class="container hidden" id="registerPage">

    <div class="form-box">

        <h2>Faculty Registration</h2>
        <input type="text" id="facultyId" placeholder="Faculty ID">
        <input type="text" id="facultyName" placeholder="Faculty Name">
        <input type="text" id="facultyDept" placeholder="Department">
        <input type="text" id="facultyEmail" placeholder="Email">
        <input type="file"id="photo"accept="image/*"required>
        <button class="btn" onclick="registerFaculty()">
            Register Faculty
        </button>

        <button class="btn back" onclick="goDashboard()">
            Back
        </button>

    </div>

</div>

<!-- PROFILE PAGE -->
<div class="container hidden" id="profilePage">

    <h2>Faculty Profiles</h2>

    <div id="profileList"></div>

    <button class="btn back" onclick="goDashboard()">
        Back
    </button>

</div>

<!-- SEARCH PAGE -->
<div class="container hidden" id="searchPage">

    <h2>Search Faculty Record</h2>

    <input type="text" id="searchInput"
    placeholder="Search by ID or Name">

    <button class="btn" onclick="searchFaculty()">
        Search
    </button>

    <div id="searchResult"></div>

    <button class="btn back" onclick="goDashboard()">
        Back
    </button>

</div>
